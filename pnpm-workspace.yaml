packages:
  - "apps/*"
  - "packages/*"

# pnpm requires every dependency with an install-time build script to be
# listed here: `true` to let it run, `false` to deliberately skip it (pnpm 11+
# fails the install on unlisted ones).
allowBuilds:
  "@nestjs/core": true
  "@swc/core": true
  core-js: true
  esbuild: true
  # Pulled in by the shadcn CLI; its postinstall only copies a mock service
  # worker we don't use.
  msw: false
  sharp: true
  unrs-resolver: true

overrides:
  express: ^5.2.1
  "@types/express": ^5.0.6
  react: 19.3.0
  react-dom: 19.3.0

peerDependencyRules:
  ignoreMissing:
    - hono
