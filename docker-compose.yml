services:
  postgres:
    image: postgres:18-alpine
    container_name: sunny-postgres
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the
      # mount is the parent dir (not /var/lib/postgresql/data as in <=17).
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=postgres

volumes:
  postgres-data:
